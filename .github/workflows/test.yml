name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/games/steam-logi-ring-guard/steam_logi_ring_guard.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet build apps/windows/app-expose/AppExpose.csproj --configuration Release
      - run: dotnet run --project apps/windows/app-expose/AppExpose.Tests/AppExpose.Tests.csproj --configuration Release
